---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cluster-secrets
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  dataFrom:
    - extract:
        key: cluster-secrets
