---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./externalsecret.yaml
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: ExternalSecret
          name: kopiur-nas
        fieldPaths:
          - metadata.namespace
        options:
          create: true
