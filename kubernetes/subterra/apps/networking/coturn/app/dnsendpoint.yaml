---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: coturn
  annotations:
    external-dns.alpha.kubernetes.io/type: external
spec:
  endpoints:
    - dnsName: turn.glants.xyz
      recordType: CNAME
      targets:
        - ingress-ext.ur30.dev
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: coturn-internal
  annotations:
    external-dns.alpha.kubernetes.io/type: internal
spec:
  endpoints:
    - dnsName: turn.glants.xyz
      recordType: A
      targets:
        - 192.168.40.28
