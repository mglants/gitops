---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coturn
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Fixed relay sockets must reach the same instance without Service NAT.
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            kubernetes.io/hostname: subterra-cp2
          automountServiceAccountToken: false
          enableServiceLinks: false
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: coturn/coturn
              tag: 4.18.0-r0
            command:
              - /bin/sh
              - -ec
              - |
                umask 077
                cp /etc/coturn/turnserver.conf /tmp/turnserver.conf
                printf '\nstatic-auth-secret=%s\nrelay-ip=%s\nexternal-ip=193.41.79.236/%s\n' "$TURN_SHARED_SECRET" "$HOST_IP" "$HOST_IP" >> /tmp/turnserver.conf
                # Remove the binary's file capability; all container ports are unprivileged.
                cp /usr/bin/turnserver /tmp/turnserver
                exec /tmp/turnserver -c /tmp/turnserver.conf
            env:
              HOST_IP:
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              TURN_SHARED_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: coturn-secret
                    key: TURN_SHARED_SECRET
            ports:
              - name: turn-tcp
                containerPort: 3480
              - name: turn-udp
                containerPort: 3480
                protocol: UDP
              - name: turns
                containerPort: 5349
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: turn-tcp
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: turn-tcp
    configMaps:
      config:
        data:
          turnserver.conf: |-
            listening-port=3480
            tls-listening-port=5349
            listening-ip=0.0.0.0
            realm=turn.glants.xyz
            use-auth-secret
            fingerprint
            cert=/etc/coturn/tls/tls.crt
            pkey=/etc/coturn/tls/tls.key
            no-tcp-relay
            no-multicast-peers
            no-cli
            denied-peer-ip=0.0.0.0-0.255.255.255
            denied-peer-ip=127.0.0.0-127.255.255.255
            denied-peer-ip=169.254.0.0-169.254.255.255
            denied-peer-ip=10.0.0.0-10.255.255.255
            denied-peer-ip=172.16.0.0-172.31.255.255
            denied-peer-ip=192.168.0.0-192.168.255.255
            # SFUs live on pod addresses; Jitsi can also use node ICE addresses.
            allowed-peer-ip=10.244.0.0-10.244.255.255
            allowed-peer-ip=192.168.48.110-192.168.48.112
            min-port=49160
            max-port=49259
            relay-threads=2
            user-quota=12
            total-quota=100
            stale-nonce=600
            userdb=/tmp/turndb
            pidfile=/tmp/turnserver.pid
            log-file=stdout
            simple-log
    service:
      main:
        forceRename: coturn-public
        controller: main
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: 192.168.40.28
        ports:
          turn-tcp:
            port: 3480
          turn-udp:
            port: 3480
            protocol: UDP
          turns:
            port: 5349
          turns-443:
            port: 443
            targetPort: turns
          # Kubernetes requires each relay port to be listed individually.
          relay-49160: {port: 49160, targetPort: 49160, protocol: UDP}
          relay-49161: {port: 49161, targetPort: 49161, protocol: UDP}
          relay-49162: {port: 49162, targetPort: 49162, protocol: UDP}
