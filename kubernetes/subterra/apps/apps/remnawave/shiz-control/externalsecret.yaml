---
# Settings: one field per SHIZ_ variable (server/lastresort/README.md in shiz-networks/app).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shiz-control
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: shiz-control-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: shiz-control
---
# Pull secret for the private shiz-networks packages on git.glants.xyz.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glants-registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: glants-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"git.glants.xyz":{"username":"{{ .GLANTS_USERNAME }}","password":"{{ .GLANTS_PASSWORD }}","auth":"{{ printf "%s:%s" .GLANTS_USERNAME .GLANTS_PASSWORD | b64enc }}"}}}
  dataFrom:
    - extract:
        key: docker-registry
