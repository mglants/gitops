---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shiz-control
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      # Last-resort control service (shiz-networks/app, server/lastresort).
      # Outbound only: panel, enrolment bucket, the exit's command port.
      # Exactly one replica, or two would hand out the same addresses.
      shiz-control:
        forceRename: shiz-control
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: glants-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: git.glants.xyz/shiz-networks/shiz-control
              tag: sha-37017c6
            env:
              SHIZ_PANEL_URL: http://remnawave.apps.svc.cluster.local:3000
              SHIZ_PANEL_INTERNAL: "true"
              SHIZ_SESSION_FILE: /var/lib/shiz-control/sessions.json
            envFrom:
              - secretRef:
                  name: shiz-control-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    persistence:
      state:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: shiz-control-state
        globalMounts:
          - path: /var/lib/shiz-control
