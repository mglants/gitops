---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailu-data-v4
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-mailu-clamav-v2
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 10Gi
