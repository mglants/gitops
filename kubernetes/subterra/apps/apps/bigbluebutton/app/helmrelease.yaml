              - path: /var/lib/bbb-webrtc-recorder
          recordings:
            app:
              - path: /var/lib/bbb-webrtc-recorder
          recording-starter:
            app:
              - path: /var/lib/bbb-webrtc-recorder
          recording-captions:
            app:
              - path: /var/lib/bbb-webrtc-recorder
      greenlight-storage:
        type: persistentVolumeClaim
        storageClass: truenas-iscsi
        accessMode: ReadWriteOnce
        size: 5Gi
        annotations:
          helm.sh/resource-policy: keep
        advancedMounts:
          greenlight:
            app:
              - path: /usr/src/app/storage
            migrate:
              - path: /usr/src/app/storage
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      recording-logs:
        type: emptyDir
