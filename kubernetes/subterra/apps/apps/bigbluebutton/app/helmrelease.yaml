            app:
              - path: /var/log/bigbluebutton
          recording-starter:
            app:
              - path: /var/log/bigbluebutton
          recording-captions:
            app:
              - path: /var/log/bigbluebutton
      greenlight-assets:
        type: emptyDir
        advancedMounts:
          greenlight:
            assets:
              - path: /work
            migrate:
              - path: /usr/src/app/app/assets
