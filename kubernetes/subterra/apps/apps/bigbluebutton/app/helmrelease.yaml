              - path: /usr/src/app/public/assets
                subPath: public-assets
      greenlight-tmp:
        type: emptyDir
        advancedMounts:
          greenlight:
            assets:
              - path: /usr/src/app/tmp
            migrate:
              - path: /usr/src/app/tmp
            app:
              - path: /usr/src/app/tmp
      greenlight-log:
        type: emptyDir
