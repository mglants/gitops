---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bigbluebutton-pgsql-init
data:
  init.sql: |
    ALTER DATABASE greenlight OWNER TO greenlight;
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: bigbluebutton-pgsql
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  postgresVersion: 16
  databaseInitSQL:
    name: bigbluebutton-pgsql-init
    key: init.sql
  patroni:
    dynamicConfiguration:
      synchronous_mode: true
      postgresql:
        synchronous_commit: true
        parameters:
          max_connections: 150
        pg_hba:
          - hostnossl all all all md5
          - hostssl all all all md5
  instances:
    - name: postgres
      replicas: 2
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  postgres-operator.crunchydata.com/cluster: bigbluebutton-pgsql
                  postgres-operator.crunchydata.com/data: postgres
      dataVolumeClaimSpec:
        storageClassName: truenas-iscsi
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
  users:
    - name: bigbluebutton
      databases:
        - bbb_graphql
        - blocknote_app
        - hasura_app
      options: SUPERUSER
      password:
        type: AlphaNumeric
    - name: greenlight
      databases:
        - greenlight
      password:
        type: AlphaNumeric
  backups:
    pgbackrest:
      configuration:
        - secret:
            name: pgo-s3-creds
      global:
        archive-push-queue-max: 4GiB
        repo1-retention-full: "14"
        repo1-retention-full-type: time
        repo1-path: /bigbluebutton/repo1
        repo1-s3-uri-style: path
        repo1-storage-port: "30002"
      manual:
        repoName: repo1
        options:
          - --type=full
      repos:
        - name: repo1
          schedules:
            full: 30 3 * * 0
            differential: 30 3 * * 1-6
          s3:
            bucket: crunchy-postgres
            endpoint: nas.ur30.ru
            region: us-east-1
