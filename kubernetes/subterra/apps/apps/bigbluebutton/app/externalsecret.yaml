---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bigbluebutton
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bigbluebutton-env
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        SHARED_SECRET: "{{ .SHARED_SECRET }}"
        HASURA_SECRET: "{{ .HASURA_SECRET }}"
        LIVEKIT_KEY: "{{ .LIVEKIT_KEY }}"
        LIVEKIT_SECRET: "{{ .LIVEKIT_SECRET }}"
        SECRET_KEY_BASE: "{{ .SECRET_KEY_BASE }}"
        SMTP_SERVER: "{{ .SMTP_HOST }}"
        SMTP_USERNAME: "{{ .SMTP_USERNAME }}"
        SMTP_PASSWORD: "{{ .SMTP_PASSWORD }}"
        TURN_SECRET: "{{ .TURN_SHARED_SECRET }}"
        GLADIA_API_KEY: '{{ index . "GLADIA_API_KEY" | default "" }}'
        LIVEKIT_CONFIG: |
          port: 7880
          bind_addresses: [0.0.0.0]
          rtc:
            node_ip: 193.41.79.236
            advertise_internal_ip: true
            use_external_ip: false
            tcp_port: 7887
            udp_port: 7888
            stun_servers: [turn.glants.xyz:3480]
            turn_servers:
              - host: turn.glants.xyz
                port: 3480
                protocol: udp
                secret: {{ .TURN_SHARED_SECRET | quote }}
                ttl: 300
              - host: turn.glants.xyz
                port: 443
                protocol: tls
                secret: {{ .TURN_SHARED_SECRET | quote }}
                ttl: 300
          redis:
            address: bigbluebutton-dragonfly.apps.svc.cluster.local:6379
            db: 2
          keys:
            {{ .LIVEKIT_KEY | quote }}: {{ .LIVEKIT_SECRET | quote }}
          webhook:
            api_key: {{ .LIVEKIT_KEY | quote }}
            urls: [http://bigbluebutton-signaling:3040/livekit-webhook]
          logging:
            level: info
  dataFrom:
    - extract:
        key: bigbluebutton
    - extract:
        key: smtp
    - extract:
        key: coturn
