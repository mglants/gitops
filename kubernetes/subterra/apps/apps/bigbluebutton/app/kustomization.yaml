---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - externalsecret.yaml
  - postgrescluster.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: bigbluebutton-cleanup
    files:
      - cleanup.py=scripts/cleanup.py
generatorOptions:
  disableNameSuffixHash: true
