---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: fluxer-pgsql
spec:
  postgresVersion: 15
  databaseInitSQL:
    name: fluxer-pgsql-init
    key: init.sql
  patroni:
    dynamicConfiguration:
      synchronous_mode: true
      postgresql:
        synchronous_commit: on
        parameters:
          max_connections: 150
        pg_hba:
          - hostnossl all all all md5
          - hostssl all all all md5
  instances:
    - name: postgres
      replicas: 2
      dataVolumeClaimSpec:
        storageClassName: truenas-iscsi
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
  users:
    - name: fluxer
      databases:
        - fluxer
      password:
        type: AlphaNumeric
  backups:
    pgbackrest:
      configuration:
        - secret:
            name: pgo-s3-creds
      global:
        archive-push-queue-max: 4GiB
        repo1-retention-full: '14'
        repo1-retention-full-type: time
        repo1-path: /fluxer/repo1
        repo1-s3-uri-style: path
        repo1-storage-port: '30002'
      manual:
        repoName: repo1
        options:
          - --type=full
      repos:
        - name: repo1
          schedules:
            full: 30 3 * * 0
            differential: 30 3 * * 1-6
          s3:
            bucket: crunchy-postgres
            endpoint: nas.ur30.ru
            region: us-east-1
---
# Bootstrap SQL must be available independently of Helm install/remediation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluxer-pgsql-init
data:
  init.sql: |
    \connect fluxer
    GRANT USAGE, CREATE ON SCHEMA public TO fluxer;
