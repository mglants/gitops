---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-fluxer
  namespace: flux-system
spec:
  components:
    - ../../../../../components/dragonfly
  patches:
    - target:
        group: dragonflydb.io
        version: v1alpha1
        kind: Dragonfly
        name: .*-dragonfly
      patch: |-
        - op: add
          path: /spec/resources/requests/memory
          value: 256Mi
        - op: add
          path: /spec/affinity
          value:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: fluxer-dragonfly
  postBuild:
    substitute:
      APP: fluxer
      DRAGONFLY_REPLICAS: "3"
  interval: 30m
  timeout: 15m
  path: ./kubernetes/subterra/apps/apps/fluxer/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  targetNamespace: apps
  dependsOn:
    - name: cluster-apps-coturn
    - name: dragonfly-operator
    - name: cluster-apps-crunchy-postgres-operator
    - name: cluster-apps-external-secrets-stores
    - name: cluster-apps-truenas-csi
    - name: envoy-gateway-gateway
  wait: false
