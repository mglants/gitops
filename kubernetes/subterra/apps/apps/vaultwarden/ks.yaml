---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-vaultwarden
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 10m
  path: ./kubernetes/subterra/apps/apps/vaultwarden/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  wait: false
  postBuild:
    substitute:
      APP: vaultwarden
      KOPIUR_CLAIM: vaultwarden-config-v2
      KOPIUR_MOVER_FSGID: "1000"
      KOPIUR_MOVER_GID: "0"
      KOPIUR_MOVER_RUN_AS_NON_ROOT: "false"
      KOPIUR_MOVER_UID: "0"
      KOPIUR_NAMESPACE: apps
  dependsOn:
    - name: cluster-apps-external-secrets-stores
    - name: cluster-apps-truenas-csi
    - name: cluster-apps-crunchy-postgres-operator
    - name: kopiur-repository
