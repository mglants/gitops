---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-wp-dachia
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/subterra/apps/www/wp-dachia/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  wait: false # no flux ks dependents
  dependsOn:
    - name: cluster-apps-external-secrets-stores
    - name: cluster-apps-truenas-csi
    - name: cluster-apps-crunchy-postgres-operator
  components:
    - ../../../../components/kopiur/backup
  targetNamespace: www
  postBuild:
    substitute:
      APP: wp-dachia
      KOPIUR_CLAIM: wp-dachia-wp-v2
      KOPIUR_MOVER_UID: "1001"
      KOPIUR_MOVER_GID: "1001"
      KOPIUR_MOVER_FSGID: "1000"
      KOPIUR_MOVER_RUN_AS_NON_ROOT: "true"
