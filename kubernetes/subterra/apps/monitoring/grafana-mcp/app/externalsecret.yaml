---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: Grafana MCP
        property: token
