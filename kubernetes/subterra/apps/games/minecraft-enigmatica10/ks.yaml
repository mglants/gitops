---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft-enigmatica10
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/subterra/apps/games/minecraft-enigmatica10/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  wait: false # no flux ks dependents
  components:
    - ../../../../components/kopiur/backup
  targetNamespace: games
  postBuild:
    substitute:
      APP: minecraft-enigmatica10
      KOPIUR_CLAIM: minecraft-enigmatica10-v2
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "3000"
      KOPIUR_MOVER_FSGID: "1000"
      KOPIUR_MOVER_RUN_AS_NON_ROOT: "true"
