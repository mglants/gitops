---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-telegram-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mautrix-telegram-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          homeserver:
            address: http://ess-synapse:8008
            domain: glants.xyz
            verify_ssl: false
          appservice:
            hostname: 0.0.0.0
            port: 29317
            address: http://mautrix-telegram:29317
            database: {{ .APPSERVICE_DATABASE | quote }}
            as_token: {{ .APPSERVICE_AS_TOKEN | quote }}
            hs_token: {{ .APPSERVICE_HS_TOKEN | quote }}
          bridge:
            permissions:
              '*': relay
              '@mark:glants.xyz': admin
          telegram:
            api_id: {{ .TELEGRAM_API_ID }}
            api_hash: {{ .TELEGRAM_API_HASH | quote }}
            bot_token: {{ .TELEGRAM_BOT_TOKEN | quote }}
        registration.yaml: |
          id: telegram
          as_token: {{ .APPSERVICE_AS_TOKEN | quote }}
          hs_token: {{ .APPSERVICE_HS_TOKEN | quote }}
          namespaces:
            users:
              - exclusive: true
                regex: '@telegram_.*:glants\.xyz'
              - exclusive: true
                regex: '@telegrambot:glants\.xyz'
            aliases:
              - exclusive: true
                regex: \#telegram_.*:glants\.xyz
          url: http://mautrix-telegram:29317
          sender_localpart: G9mCBKag7JN4L_yu_vKEP3sxZenSwTB7XDwNyn9GlTVJlcTH2AKuPIHCQ4KSX6Ep
          rate_limited: false
          de.sorunome.msc2409.push_ephemeral: true
          receive_ephemeral: true
  data:
    - secretKey: APPSERVICE_DATABASE
      remoteRef:
        key: mautrix-telegram
        property: APPSERVICE_DATABASE
    - secretKey: APPSERVICE_AS_TOKEN
      remoteRef:
        key: mautrix-telegram
        property: APPSERVICE_AS_TOKEN
    - secretKey: APPSERVICE_HS_TOKEN
      remoteRef:
        key: mautrix-telegram
        property: APPSERVICE_HS_TOKEN
    - secretKey: TELEGRAM_API_ID
      remoteRef:
        key: mautrix-telegram
        property: TELEGRAM_API_ID
    - secretKey: TELEGRAM_API_HASH
      remoteRef:
        key: mautrix-telegram
        property: TELEGRAM_API_HASH
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: mautrix-telegram
        property: TELEGRAM_BOT_TOKEN
