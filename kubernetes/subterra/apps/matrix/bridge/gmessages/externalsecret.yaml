---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-gmessages-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mautrix-gmessages-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          network:
            displayname_template: '{{ "{{" }}or .FullName .PhoneNumber}}'
            device_meta:
              os: mautrix-gmessages
              browser: OTHER
              type: TABLET
            aggressive_reconnect: false
            initial_chat_sync_count: 25
          bridge:
            command_prefix: '!gm'
            personal_filtering_spaces: true
            private_chat_portal_meta: true
            async_events: false
            split_portals: false
            resend_bridge_info: false
            no_bridge_info_state_key: false
            bridge_status_notices: errors
            unknown_error_auto_reconnect: null
            bridge_matrix_leave: false
            bridge_notices: false
            tag_only_on_create: true
            only_bridge_tags:
              - m.favourite
              - m.lowpriority
            mute_only_on_create: true
            deduplicate_matrix_messages: false
            cross_room_replies: false
            revert_failed_state_changes: false
            cleanup_on_logout:
              enabled: true
              manual:
                private: delete
                relayed: delete
                shared_no_users: delete
                shared_has_users: delete
              bad_credentials:
                private: delete
                relayed: delete
                shared_no_users: delete
                shared_has_users: delete
            relay:
              enabled: false
              admin_only: true
              default_relays: []
              message_formats:
                m.text: '<b>{{ "{{" }} .Sender.DisambiguatedName }}</b>: {{ "{{" }} .Message }}'
                m.notice: '<b>{{ "{{" }} .Sender.DisambiguatedName }}</b>: {{ "{{" }} .Message }}'
                m.emote: '* <b>{{ "{{" }} .Sender.DisambiguatedName }}</b> {{ "{{" }} .Message }}'
                m.file: '<b>{{ "{{" }} .Sender.DisambiguatedName }}</b> sent a file{{ "{{" }} if .Caption }}: {{ "{{" }} .Caption }}{{ "{{" }} end }}'
                m.image: '<b>{{ "{{" }} .Sender.DisambiguatedName }}</b> sent an image{{ "{{" }} if .Caption }}: {{ "{{" }} .Caption }}{{ "{{" }} end }}'
                m.audio: '<b>{{ "{{" }} .Sender.DisambiguatedName }}</b> sent an audio file{{ "{{" }} if .Caption }}: {{ "{{" }} .Caption }}{{ "{{" }} end }}'
                m.video: '<b>{{ "{{" }} .Sender.DisambiguatedName }}</b> sent a video{{ "{{" }} if .Caption }}: {{ "{{" }} .Caption }}{{ "{{" }} end }}'
                m.location: '<b>{{ "{{" }} .Sender.DisambiguatedName }}</b> sent a location{{ "{{" }} if .Caption }}: {{ "{{" }} .Caption }}{{ "{{" }} end }}'
              displayname_format: '{{ "{{" }} .DisambiguatedName }}'
            permissions:
              '*': relay
              '@mark:glants.xyz': admin
          database:
            type: postgres
            uri: {{ .DATABASE_URI | quote }}
            max_open_conns: 5
            max_idle_conns: 1
            max_conn_idle_time: null
            max_conn_lifetime: null
          homeserver:
            address: http://ess-synapse:8008
            domain: glants.xyz
            software: standard
            status_endpoint: null
            message_send_checkpoint_endpoint: null
            async_media: false
            websocket: false
            ping_interval_seconds: 0
          appservice:
            address: http://mautrix-gmessages:29336
            public_address: https://bridge.example.com
            hostname: 0.0.0.0
            port: 29336
            id: gmessages
            bot:
              username: gmessagesbot
              displayname: Google Messages bridge bot
              avatar: mxc://maunium.net/yGOdcrJcwqARZqdzbfuxfhzb
            ephemeral_events: true
            async_transactions: false
            as_token: {{ .APPSERVICE_AS_TOKEN | quote }}
            hs_token: {{ .APPSERVICE_HS_TOKEN | quote }}
            username_template: gmessages_{{ "{{" }}.}}
          matrix:
            message_status_events: false
            delivery_receipts: false
            message_error_notices: true
            sync_direct_chat_list: true
            federate_rooms: true
            upload_file_threshold: 5242880
          analytics:
            token: null
            url: https://api.segment.io/v1/track
            user_id: null
          provisioning:
            shared_secret: {{ .PROVISIONING_SHARED_SECRET | quote }}
            allow_matrix_auth: true
            debug_endpoints: false
            enable_session_transfers: false
          public_media:
            enabled: false
            signing_key: {{ .PUBLIC_MEDIA_SIGNING_KEY | quote }}
            expiry: 0
            hash_length: 32
          direct_media:
            enabled: false
            server_name: discord-media.example.com
            well_known_response: null
            media_id_prefix: null
            allow_proxy: true
            server_key: {{ .DIRECT_MEDIA_SERVER_KEY | quote }}
          backfill:
            enabled: false
            max_initial_messages: 50
            max_catchup_messages: 500
            unread_hours_threshold: 720
            threads:
              max_initial_messages: 50
            queue:
              enabled: false
              batch_size: 100
              batch_delay: 20
              max_batches: -1
              max_batches_override: {}
          double_puppet:
            servers:
              anotherserver.example.org: https://matrix.anotherserver.example.org
            allow_discovery: false
            secrets:
              example.com: {{ .DOUBLE_PUPPET_SECRETS_EXAMPLE_COM | quote }}
          encryption:
            allow: false
            default: false
            require: false
            appservice: false
            msc4190: false
            self_sign: false
            allow_key_sharing: true
            pickle_key: {{ .ENCRYPTION_PICKLE_KEY | quote }}
            delete_keys:
              delete_outbound_on_ack: false
              dont_store_outbound: false
              ratchet_on_decrypt: false
              delete_fully_used_on_decrypt: false
              delete_prev_on_new_session: false
              delete_on_device_delete: false
              periodically_delete_expired: false
              delete_outdated_inbound: false
            verification_levels:
              receive: unverified
              send: unverified
              share: cross-signed-tofu
            rotation:
              enable_custom: false
              milliseconds: 604800000
              messages: 100
              disable_device_change_key_rotation: false
          logging:
            min_level: warn
            writers:
              - type: stdout
                format: pretty-colored
        registration.yaml: |
          id: gmessages
          url: http://mautrix-gmessages:29336
          as_token: {{ .APPSERVICE_AS_TOKEN | quote }}
          hs_token: {{ .APPSERVICE_HS_TOKEN | quote }}
          sender_localpart: arYxtMwSmRDDk5Ei9itcTLkEFgVusjUT
          rate_limited: false
          namespaces:
            users:
              - regex: ^@gmessagesbot:glants\.xyz$
                exclusive: true
              - regex: ^@gmessages_.*:glants\.xyz$
                exclusive: true
          de.sorunome.msc2409.push_ephemeral: true
          receive_ephemeral: true
  data:
    - secretKey: DATABASE_URI
      remoteRef:
        key: mautrix-gmessages
        property: DATABASE_URI
    - secretKey: APPSERVICE_AS_TOKEN
      remoteRef:
        key: mautrix-gmessages
        property: APPSERVICE_AS_TOKEN
    - secretKey: APPSERVICE_HS_TOKEN
      remoteRef:
        key: mautrix-gmessages
        property: APPSERVICE_HS_TOKEN
    - secretKey: PROVISIONING_SHARED_SECRET
      remoteRef:
        key: mautrix-gmessages
        property: PROVISIONING_SHARED_SECRET
    - secretKey: PUBLIC_MEDIA_SIGNING_KEY
      remoteRef:
        key: mautrix-gmessages
        property: PUBLIC_MEDIA_SIGNING_KEY
    - secretKey: DIRECT_MEDIA_SERVER_KEY
      remoteRef:
        key: mautrix-gmessages
        property: DIRECT_MEDIA_SERVER_KEY
    - secretKey: DOUBLE_PUPPET_SECRETS_EXAMPLE_COM
      remoteRef:
        key: mautrix-gmessages
        property: DOUBLE_PUPPET_SECRETS_EXAMPLE_COM
    - secretKey: ENCRYPTION_PICKLE_KEY
      remoteRef:
        key: mautrix-gmessages
        property: ENCRYPTION_PICKLE_KEY
