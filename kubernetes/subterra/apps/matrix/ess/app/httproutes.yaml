apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ess-synapse
  namespace: matrix
spec:
  parentRefs:
    - name: envoy-external
      namespace: networking
      sectionName: https
  hostnames:
    - matrix.glants.xyz
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: ^/_matrix/client/(api/v1|r0|v3|unstable)/(login|logout|refresh)(/.*)?$
      backendRefs:
        - name: ess-matrix-authentication-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /_synapse
      backendRefs:
        - name: ess-synapse
          port: 8008
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
