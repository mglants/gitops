apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ess-rtc
  namespace: matrix
spec:
  parentRefs:
    - name: envoy-external
      namespace: networking
      sectionName: https
  hostnames:
    - matrix-rtc.glants.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sfu/get
        - path:
            type: PathPrefix
            value: /get_token
        - path:
            type: PathPrefix
            value: /delegate_delayed_leave
      backendRefs:
        - name: ess-matrix-rtc-authorisation-service
          port: 8080
    - backendRefs:
        - name: ess-matrix-rtc-sfu
          port: 7880
      timeouts:
        request: 0s
