---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ess
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ess-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        mas.yaml: |-
          account:
            password_registration_enabled: false
          passwords:
            enabled: true
            schemes:
              - version: 1
                algorithm: bcrypt
                unicode_normalization: true
              - version: 2
                algorithm: argon2id
          upstream_oauth2:
            providers:
              - id: 01K7R5DKD0E2Z0F8TDS4E5VYZM
                synapse_idp_id: oidc-authentik
                human_name: Authentik
                issuer: https://authentik.glants.xyz/application/o/matrix/
                client_id: matrix
                client_secret: {{ .OIDC_CLIENT_SECRET | quote }}
                token_endpoint_auth_method: client_secret_basic
                scope: openid profile email
                claims_imports:
                  localpart:
                    action: require
                    template: '{{ "{{ user.nickname }}" }}'
                  displayname:
                    action: force
                    template: '{{ "{{ user.name | capitalize }}" }}'
                  email:
                    action: force
                    template: '{{ "{{ user.email }}" }}'
          email:
            from: '"Glants Matrix" <matrix@glants.xyz>'
            transport: smtp
            mode: tls
            hostname: {{ .SMTP_HOST | quote }}
            port: 465
            username: {{ .SMTP_USERNAME | quote }}
            password: {{ .SMTP_PASSWORD | quote }}
        matrix-rtc-registration.yaml: |-
          id: matrix-rtc
          as_token: '{{ .LIVEKIT_AS_TOKEN }}'
          hs_token: '{{ .LIVEKIT_HS_TOKEN }}'
          sender_localpart: _matrix_rtc
          namespaces:
            users:
              - exclusive: false
                regex: '.*'
          url: null
          io.element.msc4502.scopes:
            - urn:matrix:client:io.element.msc4502:rooms:is_joined
          io.element.msc4512.proxy_prefix: rtc/livekit
          io.element.msc4512.proxy_url: http://ess-matrix-rtc-authorisation-service.matrix.svc.cluster.local:8080
        livekit-turn.yaml: |-
          rtc:
            advertise_internal_ip: true
            stun_servers:
              - turn.glants.xyz:3480
              - stun.l.google.com:19302
            turn_servers:
              - host: turn.glants.xyz
                port: 3480
                protocol: udp
                secret: '{{ .TURN_SHARED_SECRET }}'
                ttl: 300
              - host: turn.glants.xyz
                port: 443
                protocol: tls
                secret: '{{ .TURN_SHARED_SECRET }}'
                ttl: 300
        synapse-turn.yaml: |-
          turn_uris:
            - turns:turn.glants.xyz:443?transport=tcp
            - turns:turn.glants.xyz:5349?transport=tcp
            - turn:turn.glants.xyz:3480?transport=udp
            - turn:turn.glants.xyz:3480?transport=tcp
          turn_shared_secret: '{{ .TURN_SHARED_SECRET }}'
          turn_user_lifetime: 86400000
  dataFrom:
    - extract:
        key: ess
    - extract:
        key: matrix-rtc
    - extract:
        key: coturn
    - extract:
        key: smtp
