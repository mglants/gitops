---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-qbittorrent
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/subterra/apps/media/qbittorrent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  wait: true
  dependsOn:
    - name: cluster-apps-truenas-csi
    - name: cluster-apps-nfs
  components:
    - ../../../../components/kopiur/backup
  targetNamespace: media
  postBuild:
    substitute:
      APP: qbittorrent
      KOPIUR_CLAIM: qbittorrent-config-v2
      KOPIUR_MOVER_UID: "568"
      KOPIUR_MOVER_GID: "568"
      KOPIUR_MOVER_FSGID: "1000"
      KOPIUR_MOVER_RUN_AS_NON_ROOT: "true"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-qbittorrent-tools
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/subterra/apps/media/qbittorrent/tools
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  wait: false
  dependsOn:
    - name: cluster-apps-qbittorrent
