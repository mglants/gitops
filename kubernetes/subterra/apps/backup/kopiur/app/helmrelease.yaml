---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
  namespace: backup
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 30m
  values:
    installScope: cluster
    streamingLists: true
    features:
      credentialProjection:
        enabled: true
    extraVolumes:
      - name: repo
        nfs:
          path: /mnt/Storinator/backup/kopiur/subterra
          server: 192.168.48.150
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    monitoring:
      dashboards:
        enabled: false
        grafanaOperator:
          enabled: false
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
