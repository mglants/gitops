---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-homeassistant
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/subterra/apps/smarthome/homeassistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  wait: false # no flux ks dependents
  dependsOn:
    - name: cluster-apps-truenas-csi
    - name: cluster-apps-external-secrets-stores
    - name: cluster-apps-crunchy-postgres-operator
  components:
    - ../../../../components/kopiur/backup
  targetNamespace: smarthome
  postBuild:
    substitute:
      APP: homeassistant
      KOPIUR_CLAIM: homeassistant-config-v2
      KOPIUR_MOVER_UID: "0"
      KOPIUR_MOVER_GID: "0"
      KOPIUR_MOVER_FSGID: "1000"
      KOPIUR_MOVER_RUN_AS_NON_ROOT: "false"
