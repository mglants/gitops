---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-operator
  interval: 30m
  path: ./kubernetes/subterra/apps/flux-system/flux-instance/app
  prune: false # Removing the release would uninstall the Flux controllers.
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  wait: true
