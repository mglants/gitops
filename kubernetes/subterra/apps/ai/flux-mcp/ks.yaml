---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-mcp
  namespace: flux-system
spec:
  dependsOn:
    - name: kubectl-mcp
  interval: 1h
  path: ./kubernetes/subterra/apps/ai/flux-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  targetNamespace: ai
  wait: true
