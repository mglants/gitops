---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: searxng
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-apps-external-secrets-stores
    - name: searxng-valkey
    - name: envoy-gateway-gateway
  interval: 1h
  path: ./kubernetes/subterra/apps/ai/searxng/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  targetNamespace: ai
  wait: true
