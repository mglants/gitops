---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  chartRef:
    kind: OCIRepository
    name: searxng
  interval: 30m
  values:
    externalSecrets:
      searxng:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        data:
          - secretKey: SEARXNG_SECRET
            remoteRef:
              key: SearXNG
              property: searxng_secret_key
    networkpolicies:
      searxng:
        type: cilium
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/name: searxng-valkey
            toPorts:
              - ports:
                  - port: "6379"
                    protocol: TCP
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: networking
                  gateway.envoyproxy.io/owning-gateway-name: envoy-internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: hermes
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
    controllers:
      searxng:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 977
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 977
            runAsUser: 977
        containers:
          main:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2026.11.23-a7163d091@sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a
            env:
              SEARXNG_BASE_URL: https://search.ur30.dev
              SEARXNG_PORT: &httpPort 8080
              SEARXNG_VALKEY_URL: "redis://searxng-valkey:6379"
            envFrom:
              - externalSecretRef:
                  identifier: searxng
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /stats
                    port: *httpPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /stats
                    port: *httpPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - SETGID
                  - SETUID
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      config:
        type: configMap
        name: searxng-config
        globalMounts:
          - path: /etc/searxng/limiter.toml
            subPath: limiter.toml
            readOnly: true
          - path: /etc/searxng/settings.yml
            subPath: settings.yaml
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - search.ur30.dev
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
    service:
      app:
        ports:
          http:
            port: *httpPort
