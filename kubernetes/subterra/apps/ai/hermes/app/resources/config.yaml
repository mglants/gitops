---
# Managed infrastructure overlay; profile preferences remain on the PVC.
dashboard:
  oauth:
    provider: self-hosted
    self_hosted:
      client_id: hermes
      issuer: https://authentik.glants.xyz/application/o/hermes/
      scopes: openid profile email
  public_url: https://hermes-dash.ur30.dev

gateway:
  multiplex_profiles: true

security:
  redact_secrets: true

terminal:
  backend: local
  cwd: /opt/data/workspace
  env_passthrough:
    - SEARXNG_URL

telemetry:
  shared_metrics:
    enabled: false
    send: false

webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://hermes.ur30.dev
