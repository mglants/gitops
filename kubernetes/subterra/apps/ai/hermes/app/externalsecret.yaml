---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes
    creationPolicy: Owner
  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: Hermes
        property: hermes_api_server_key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-hermes
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: Agent Gateway
        property: hermes_gateway_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-oidc
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-oidc
  data:
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: Hermes
        property: hermes_oidc_client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: berries-mcp-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: berries-mcp-key
    creationPolicy: Owner
  data:
    - secretKey: subterra-hermes
      remoteRef:
        key: Berries MCP Access
        property: token
