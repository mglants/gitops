---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-telegram
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-telegram
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: Hermes
        property: telegram_bot_token
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef:
        key: Hermes
        property: telegram_user_id
    - secretKey: TELEGRAM_GROUP_ID
      remoteRef:
        key: Hermes
        property: telegram_group_id
