      remoteRef:
        key: Hermes
        property: hermes_oidc_client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: berries-mcp-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: berries-mcp-key
    creationPolicy: Owner
  data:
    - secretKey: subterra-hermes
      remoteRef:
        key: Berries MCP Access
        property: token
