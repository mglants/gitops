---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: flux-system
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: cluster-apps-external-secrets-stores
    - name: cluster-apps-truenas-csi
    - name: kopiur-repository
    - name: cluster-apps-authentik
    - name: agentgateway
    - name: searxng
  postBuild:
    substitute:
      APP: hermes
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_MOVER_UID: "10000"
      KOPIUR_MOVER_GID: "10000"
  interval: 1h
  path: ./kubernetes/subterra/apps/ai/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  targetNamespace: ai
  wait: true
