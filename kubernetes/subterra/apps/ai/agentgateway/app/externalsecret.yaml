---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: Agent Gateway
        property: gateway_session_key
    - secretKey: CLIPROXYAPI_API_KEY
      remoteRef:
        key: CLIProxyAPI
        property: cliproxyapi_key
    - secretKey: CONTEXT7_API_KEY
      remoteRef:
        key: Agent Gateway
        property: context7_api_key
    - secretKey: HERMES_API_KEY
      remoteRef:
        key: Agent Gateway
        property: hermes_gateway_key
    - secretKey: MISTRAL_API_KEY
      remoteRef:
        key: Agent Gateway
        property: mistral_api_key
    - secretKey: DEEPSEEK_API_KEY
      remoteRef:
        key: Agent Gateway
        property: deepseek_api_key
