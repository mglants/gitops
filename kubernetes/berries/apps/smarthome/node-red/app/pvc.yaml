---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node-red-data-v2
  namespace: smarthome
spec:
  storageClassName: truenas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: truenas-csi-import-node-red-data-v1
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: truenas-csi-import-node-red-data-v1
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: truenas-csi-import-node-red-data-v1
  namespace: smarthome
spec:
  source:
    volumeSnapshotContentName: truenas-csi-import-node-red-data-v1
  volumeSnapshotClassName: truenas-csi
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotContent
metadata:
  name: truenas-csi-import-node-red-data-v1
spec:
  deletionPolicy: Retain
  driver: csi.truenas.io
  source:
    snapshotHandle: ssd/k8s/nfs/pvc-7ae79711-7ffb-4b68-8dce-5f057b5d5e57@truenas-csi-import-node-red-data-v1
  volumeSnapshotClassName: truenas-csi
  volumeSnapshotRef:
    name: truenas-csi-import-node-red-data-v1
    namespace: smarthome
