---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config-v2
  namespace: smarthome
spec:
  # Preserve immutable snapshot provenance on this restored claim.
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: truenas-csi-import-homeassistant-config-v1
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: truenas-csi-import-homeassistant-config-v1
  storageClassName: truenas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
