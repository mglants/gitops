---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config-v2
  namespace: smarthome
spec:
  storageClassName: truenas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: truenas-csi-import-homeassistant-config-v1
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: truenas-csi-import-homeassistant-config-v1
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: truenas-csi-import-homeassistant-config-v1
  namespace: smarthome
spec:
  source:
    volumeSnapshotContentName: truenas-csi-import-homeassistant-config-v1
  volumeSnapshotClassName: truenas-csi
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotContent
metadata:
  name: truenas-csi-import-homeassistant-config-v1
spec:
  deletionPolicy: Retain
  driver: csi.truenas.io
  source:
    snapshotHandle: ssd/k8s/nfs/pvc-07550fe2-c6e2-4d96-a591-1071a51aa151@truenas-csi-import-homeassistant-config-v1
  volumeSnapshotClassName: truenas-csi
  volumeSnapshotRef:
    name: truenas-csi-import-homeassistant-config-v1
    namespace: smarthome
