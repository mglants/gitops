---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: berries-ops-mcp
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: berries-grafana-mcp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: berries-home-assistant-mcp
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: berries-mcp-access
    extractFrom:
      - headers:
          - x-api-key
