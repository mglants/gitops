---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
spec:
  chartRef:
    apiVersion: source.toolkit.fluxcd.io/v1beta2
    kind: OCIRepository
    name: berries-mcp-chart
  interval: 30m
  values:
    controllers:
      grafana-mcp:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          labels:
            app.kubernetes.io/name: grafana-mcp
            app.kubernetes.io/instance: grafana-mcp
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
        replicas: 1
        containers:
          mcp:
            image:
              repository: grafana/mcp-grafana
              tag: 2.4.0@sha256:b6c5b2807c2c93c0107eb3b928d91c6309b822be74c4133dbfaa163cb4af5f2b
            args:
            - --transport
            - streamable-http
            - --disable-write
            - --allowed-hosts=localhost:8000,127.0.0.1:8000,grafana-mcp.ai.svc.cluster.local:8000,grafana-mcp.ai.svc.cluster.local,grafana-mcp.ai:8000,grafana-mcp:8000
            env:
              GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE:
                value: /var/run/secrets/grafana/token
              GRAFANA_URL:
                value: http://grafana.monitoring.svc.cluster.local
              GRAFANA_USAGE_STATS:
                value: disabled
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
    persistence:
      grafana-token:
        type: secret
        name: grafana-mcp-token
        globalMounts:
        - path: /var/run/secrets/grafana
          readOnly: true
    service:
      app:
        controller: grafana-mcp
        ports:
          http:
            port: 8000
            targetPort: 8000
            protocol: TCP
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-mcp
spec:
  chartRef:
    apiVersion: source.toolkit.fluxcd.io/v1beta2
    kind: OCIRepository
    name: berries-mcp-chart
  interval: 30m
  values:
    controllers:
      home-assistant-mcp:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          labels:
            app.kubernetes.io/name: home-assistant-mcp
            app.kubernetes.io/instance: home-assistant-mcp
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
        replicas: 1
        containers:
          mcp:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 9.2.0@sha256:9de5bf6c4216142fdffe862900abe72dac8dfe9621dd0b2b050d132372b676ba
            args:
            - ha-mcp-web
            env:
              HA_MCP_DISABLE_SETTINGS_UI:
                value: 'true'
              HOMEASSISTANT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-mcp-secret
                    key: HOMEASSISTANT_TOKEN
              HOMEASSISTANT_URL:
                value: http://home-assistant.smarthome.svc.cluster.local:8123
              MCP_PORT:
                value: '8086'
              MCP_SECRET_PATH:
                value: /mcp
              READ_ONLY_MODE:
                value: 'true'
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
    persistence:
      state:
        type: emptyDir
        globalMounts:
        - path: /home/mcpuser/.ha-mcp
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
    service:
      app:
        controller: home-assistant-mcp
        ports:
          http:
            port: 8086
            targetPort: 8086
            protocol: TCP
