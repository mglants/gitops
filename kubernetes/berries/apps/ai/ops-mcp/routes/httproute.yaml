---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: berries-grafana-mcp
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  hostnames:
    - ingress-int-berries.glants.xyz
  parentRefs:
    - name: envoy-internal
      namespace: networking
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp/grafana
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: grafana-mcp.ai.svc.cluster.local
            path:
              type: ReplaceFullPath
              replaceFullPath: /mcp
      backendRefs:
        - name: grafana-mcp
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: berries-home-assistant-mcp
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  hostnames:
    - ingress-int-berries.glants.xyz
  parentRefs:
    - name: envoy-internal
      namespace: networking
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp/home-assistant
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: home-assistant-mcp.ai.svc.cluster.local
            path:
              type: ReplaceFullPath
              replaceFullPath: /mcp
      backendRefs:
        - name: home-assistant-mcp
          port: 8086
