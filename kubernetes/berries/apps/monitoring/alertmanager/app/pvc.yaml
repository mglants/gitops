---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data-v2
  namespace: monitoring
spec:
  # Preserve immutable snapshot provenance on this restored claim.
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: truenas-csi-import-alertmanager-data-v1
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: truenas-csi-import-alertmanager-data-v1
  storageClassName: truenas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
