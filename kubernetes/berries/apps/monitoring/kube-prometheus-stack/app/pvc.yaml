---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-v2-prometheus-kube-prometheus-stack-prometheus-0
  namespace: monitoring
spec:
  storageClassName: truenas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# Retained data from the kube-prometheus-stack Alertmanager that is currently
# disabled. Keep it available under the new driver without activating it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-prometheus-alertmanager-data-v2
  namespace: monitoring
spec:
  storageClassName: truenas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
