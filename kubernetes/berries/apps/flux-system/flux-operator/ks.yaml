---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/berries/apps/flux-system/flux-operator/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
  wait: true
