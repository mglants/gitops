---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: ingress-int-berries.glants.xyz,ingress-int-berries.home
      external-dns.alpha.kubernetes.io/type: internal
      lbipam.cilium.io/ips: 172.16.32.7
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: "*.glants.xyz"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: glants-xyz-tls
    - name: https-home
      hostname: "*.home"
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: envoy-internal-home-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-internal-home
spec:
  secretName: envoy-internal-home-tls
  issuerRef:
    kind: ClusterIssuer
    name: home-ca
  dnsNames:
    - "*.home"
